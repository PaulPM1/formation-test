<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Welcome · Vibe Coding</title>
  <style>
    :root {
      --bg: #0a0a0f;
      --fg: #e8e8f0;
      --muted: #8a8aa0;
      --accent-1: #ff2e97;
      --accent-2: #7a5cff;
      --accent-3: #00e0ff;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      font-family: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
      background: var(--bg);
      color: var(--fg);
      display: grid;
      place-items: center;
      min-height: 100dvh;
      overflow: hidden;
      position: relative;
    }

    /* Aurore de fond animée */
    body::before {
      content: "";
      position: absolute;
      inset: -30%;
      background:
        radial-gradient(40% 40% at 20% 30%, rgba(255, 46, 151, 0.35), transparent 60%),
        radial-gradient(45% 45% at 80% 25%, rgba(122, 92, 255, 0.35), transparent 60%),
        radial-gradient(50% 50% at 50% 80%, rgba(0, 224, 255, 0.28), transparent 60%);
      filter: blur(40px);
      animation: drift 18s ease-in-out infinite alternate;
      z-index: 0;
    }

    @keyframes drift {
      0%   { transform: translate(0, 0) scale(1); }
      50%  { transform: translate(4%, -3%) scale(1.08); }
      100% { transform: translate(-4%, 3%) scale(1); }
    }

    /* Grille discrète */
    body::after {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
      background-size: 44px 44px;
      mask-image: radial-gradient(circle at 50% 50%, #000 30%, transparent 75%);
      z-index: 0;
    }

    .card {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 3rem 2rem;
    }

    .prompt {
      color: var(--muted);
      font-size: 0.95rem;
      letter-spacing: 0.05em;
      margin-bottom: 1.25rem;
    }
    .prompt .tilde { color: var(--accent-3); }
    .prompt .cmd { color: var(--fg); }

    h1 {
      font-size: clamp(2.75rem, 10vw, 6.5rem);
      font-weight: 800;
      line-height: 1.05;
      letter-spacing: -0.03em;
      background: linear-gradient(100deg, var(--accent-1), var(--accent-2) 45%, var(--accent-3));
      background-size: 200% auto;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: shine 6s linear infinite;
    }

    @keyframes shine {
      to { background-position: 200% center; }
    }

    .subtitle {
      margin-top: 1.5rem;
      color: var(--muted);
      font-size: clamp(0.95rem, 2.5vw, 1.15rem);
      letter-spacing: 0.02em;
    }

    .cursor {
      display: inline-block;
      width: 0.6ch;
      height: 1.1em;
      background: var(--accent-3);
      margin-left: 0.15em;
      transform: translateY(0.15em);
      animation: blink 1.1s steps(2, start) infinite;
      box-shadow: 0 0 12px var(--accent-3);
    }

    @keyframes blink { 50% { opacity: 0; } }

    .tags {
      margin-top: 2.5rem;
      display: flex;
      gap: 0.6rem;
      flex-wrap: wrap;
      justify-content: center;
    }
    .tag {
      font-size: 0.8rem;
      color: var(--fg);
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.04);
      padding: 0.4rem 0.9rem;
      border-radius: 999px;
      backdrop-filter: blur(8px);
    }

    @media (prefers-reduced-motion: reduce) {
      body::before, h1, .cursor { animation: none; }
    }
  </style>
</head>
<body>
  <main class="card">
    <p class="prompt"><span class="tilde">~/formation-test</span> <span class="cmd">$ ./start --vibe</span></p>
    <h1>Welcome<br />Vibe Coding</h1>
    <p class="subtitle">Just you, the editor, and good vibes<span class="cursor"></span></p>
    <div class="tags">
      <span class="tag">#git</span>
      <span class="tag">#build</span>
      <span class="tag">#ship</span>
      <span class="tag">#havefun</span>
    </div>
  </main>
</body>
</html>
